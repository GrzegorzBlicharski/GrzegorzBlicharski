<title>Akademia Kontraktów FIDIC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: drawing-sheet course — fixed index rail on the left, one module per sheet with a title block like a construction drawing. */
:root {
  --bg: #eef0ec;
  --sheet: #fbfcfa;
  --ink: #18232c;
  --muted: #5b6770;
  --line: #d3d8d1;
  --line-strong: #9aa59d;
  --accent: #d9541e;
  --accent-soft: #f6e1d6;
  --link: #1d4f7c;
  --code-bg: #f1f3ef;
  --l1: #2f6f8f; --l2: #6b8f3a; --l3: #b07a17; --l4: #a33b3b; --l0: #7a7f86;
  --ok: #2f7d4f;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --rail: 300px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f1519; --sheet: #151d23; --ink: #e3e8e4; --muted: #98a4ab; --line: #27323a; --line-strong: #4b5a63;
  --accent: #f0773f; --accent-soft: #3a2419; --link: #8dbbe3; --code-bg: #1b252c;
  --l1: #5aa3c7; --l2: #94bd5e; --l3: #d9a441; --l4: #d86a6a; --l0: #9aa0a8; --ok: #5cbf86; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f1519; --sheet: #151d23; --ink: #e3e8e4; --muted: #98a4ab; --line: #27323a; --line-strong: #4b5a63;
  --accent: #f0773f; --accent-soft: #3a2419; --link: #8dbbe3; --code-bg: #1b252c;
  --l1: #5aa3c7; --l2: #94bd5e; --l3: #d9a441; --l4: #d86a6a; --l0: #9aa0a8; --ok: #5cbf86; color-scheme: dark }

* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font: 16px/1.65 var(--f-body); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); }
a { color: var(--link) }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }

.app { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: 100vh }

/* Rail */
.rail { position: sticky; top: env(safe-area-inset-top, 0px); height: 100vh; overflow-y: auto; background: var(--sheet); border-right: 1px solid var(--line);
  padding-block: 20px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: 16px; }
.brand { display: block; text-decoration: none; color: var(--ink); font: 700 1.5rem/1.05 var(--f-display); letter-spacing: .01em; text-transform: uppercase }
.brand small { display: block; font: 500 .72rem/1.4 var(--f-mono); color: var(--muted); letter-spacing: .06em; margin-top: 6px }
.overall { margin: 18px 0 8px; display: grid; gap: 6px }
.overall-top { display: flex; justify-content: space-between; font: 500 .75rem var(--f-mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em }
.bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden }
.bar > span { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s }
.navgroup { margin-top: 18px }
.navgroup h3 { margin: 0 0 6px; font: 600 .72rem var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); display: flex; align-items: center; gap: 8px }
.navgroup h3::before { content: ""; width: 8px; height: 8px; border-radius: 2px; background: var(--c, var(--l0)) }
.navlink { display: grid; grid-template-columns: 2.2em minmax(0,1fr) auto; gap: 6px; align-items: baseline; padding: 6px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: .92rem; line-height: 1.3 }
.navlink:hover { background: var(--code-bg) }
.navlink[aria-current="page"] { background: var(--accent-soft) }
.navlink .n { font: 500 .78rem var(--f-mono); color: var(--muted) }
.navlink .p { font: 500 .7rem var(--f-mono); color: var(--muted); font-variant-numeric: tabular-nums }
.navlink .p.full { color: var(--ok) }
.lessons { list-style: none; margin: 2px 0 8px 2.6em; padding: 0; border-left: 1px solid var(--line) }
.lessons a { display: flex; gap: 6px; padding: 3px 8px; font-size: .82rem; line-height: 1.35; color: var(--muted); text-decoration: none }
.lessons a:hover { color: var(--ink) }
.lessons a.done::before { content: "✓"; color: var(--ok) }

/* Top bar (mobile) */
.topbar { display: none }

/* Main sheet */
main { min-width: 0; padding-block: 28px 80px; padding-left: max(16px, 4vw); padding-right: max(16px, env(safe-area-inset-right, 0px), 4vw) }
.module { max-width: 920px; margin: 0 auto }
.titleblock { display: grid; grid-template-columns: auto minmax(0,1fr); border: 1.5px solid var(--ink); background: var(--sheet); margin-bottom: 32px }
.tb-num { grid-row: span 2; border-right: 1.5px solid var(--ink); padding: 12px 18px; display: grid; align-content: center; text-align: center }
.tb-num span { font: 500 .66rem var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted) }
.tb-num b { font: 700 3.2rem/1 var(--f-display); color: var(--accent) }
.tb-main { padding: 12px 18px; border-bottom: 1px solid var(--line-strong) }
.tb-group { margin: 0; font: 500 .7rem var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted) }
.tb-main h1 { margin: 2px 0 0; font: 700 clamp(1.7rem, 3.4vw, 2.5rem)/1.08 var(--f-display); text-transform: uppercase; letter-spacing: .01em; text-wrap: balance }
.tb-meta { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); margin: 0 }
.tb-meta > div { padding: 8px 18px; border-right: 1px solid var(--line) }
.tb-meta > div:last-child { border-right: 0 }
.tb-meta dt { font: 500 .66rem var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted) }
.tb-meta dd { margin: 0; font-size: .9rem; line-height: 1.4 }

/* Prose */
.prose { min-width: 0 }
.prose > * { max-width: 72ch }
.prose > .tbl, .prose > pre, .prose > .codewrap, .prose > .gantt-wrap, .prose > .hero, .prose > details, .prose > .search { max-width: none }
.prose h2 { font: 700 1.75rem/1.15 var(--f-display); text-transform: uppercase; letter-spacing: .015em; margin: 2.4em 0 .6em; padding-top: .7em; border-top: 1.5px solid var(--ink); text-wrap: balance; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: baseline; justify-content: space-between; scroll-margin-top: 16px }
.prose h3 { font: 600 1.1rem/1.3 var(--f-body); margin: 1.8em 0 .5em; text-wrap: balance }
.prose h4 { font: 600 1rem var(--f-body); margin: 1.4em 0 .4em }
.prose p, .prose li { overflow-wrap: anywhere }
.prose ul, .prose ol { padding-left: 1.4em }
.prose li { margin: .25em 0 }
.prose strong { font-weight: 600 }
.prose blockquote { margin: 1.4em 0; padding: 10px 16px; border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 6px 6px 0 }
.prose blockquote p { margin: .3em 0 }
.prose hr { border: 0; border-top: 1px dashed var(--line-strong); margin: 2.4em 0 }
.prose code { font: .86em var(--f-mono); background: var(--code-bg); padding: .1em .35em; border-radius: 4px }
.prose pre { margin: 0; background: var(--code-bg); border: 1px solid var(--line); border-radius: 6px; padding: 14px 16px; overflow-x: auto; font: .82rem/1.55 var(--f-mono) }
.prose pre code { background: none; padding: 0; font-size: inherit }
.codewrap { position: relative; margin: 1.2em 0 }
.copy { position: absolute; top: 8px; right: 8px; font: 500 .72rem var(--f-mono); background: var(--sheet); color: var(--ink); border: 1px solid var(--line-strong); border-radius: 4px; padding: 3px 8px; cursor: pointer }
.copy:hover { border-color: var(--accent) }
.tbl { overflow-x: auto; margin: 1.2em 0; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet) }
table { border-collapse: collapse; width: 100%; font-size: .88rem; line-height: 1.45 }
th { text-align: left; font: 600 .74rem var(--f-mono); text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--code-bg); position: sticky; top: 0 }
th, td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top }
tr:last-child td { border-bottom: 0 }
td:first-child { font-weight: 500 }
details { margin: 1.2em 0; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--sheet) }
details > summary { cursor: pointer; padding: 10px 14px; font: 600 .82rem var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--accent); list-style: none }
details > summary::-webkit-details-marker { display: none }
details > summary::before { content: "▸ "; }
details[open] > summary::before { content: "▾ "; }
details > :not(summary) { padding: 0 16px; max-width: 72ch }
details[open] { padding-bottom: 6px }
.muted { color: var(--muted) }

.check { font: 500 .72rem var(--f-mono); letter-spacing: .04em; text-transform: uppercase; display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border: 1px solid var(--line-strong); border-radius: 999px; background: var(--sheet); color: var(--muted); cursor: pointer; white-space: nowrap }
.check[aria-pressed="true"] { border-color: var(--ok); color: var(--ok) }
.check[aria-pressed="true"]::before { content: "✓" }

.pager { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; margin-top: 56px; padding-top: 18px; border-top: 1.5px solid var(--ink) }
.pager a { display: grid; gap: 2px; text-decoration: none; color: var(--ink); padding: 10px 14px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--sheet); min-width: 0; max-width: 100% }
.pager a:hover { border-color: var(--accent) }
.pager small { font: 500 .68rem var(--f-mono); text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.pager .next { text-align: right; margin-left: auto }

/* Hero + gantt */
.hero { padding: 8px 0 12px }
.eyebrow { font: 500 .78rem var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--accent); margin: 0 0 10px }
.hero-title { font: 700 clamp(2.4rem, 6vw, 4.4rem)/.98 var(--f-display); text-transform: uppercase; letter-spacing: .005em; margin: 0; max-width: 16ch; text-wrap: balance }
.hero-lede { font-size: 1.1rem; max-width: 60ch; color: var(--muted); margin: 16px 0 22px }
.hero-actions { display: flex; flex-wrap: wrap; gap: 10px }
.btn { display: inline-block; padding: 10px 16px; border: 1.5px solid var(--ink); border-radius: 4px; text-decoration: none; color: var(--ink); font: 600 .95rem var(--f-body) }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff }
.hero-stats { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); border: 1.5px solid var(--ink); margin: 28px 0 0; background: var(--sheet) }
.hero-stats div { padding: 10px 14px; border-right: 1px solid var(--line) }
.hero-stats div:last-child { border-right: 0 }
.hero-stats dt { font: 500 .66rem var(--f-mono); text-transform: uppercase; letter-spacing: .1em; color: var(--muted) }
.hero-stats dd { margin: 0; font: 700 1.9rem/1.1 var(--f-display); font-variant-numeric: tabular-nums }
.gantt-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 6px; background: var(--sheet) }
.gantt { min-width: 640px; display: grid; font-size: .82rem }
.g-head, .g-row { display: grid; grid-template-columns: 200px repeat(12, minmax(0,1fr)); align-items: center; position: relative }
.g-head { font: 500 .7rem var(--f-mono); color: var(--muted); border-bottom: 1px solid var(--line-strong); background: var(--code-bg) }
.g-head span { padding: 6px 0; text-align: center; border-left: 1px solid var(--line) }
.g-head span:first-child { text-align: left; padding-left: 12px; border-left: 0; text-transform: uppercase; letter-spacing: .08em }
.g-row { text-decoration: none; color: var(--ink); min-height: 30px; border-bottom: 1px solid var(--line);
  background-image: repeating-linear-gradient(to right, transparent 0, transparent calc((100% - 200px)/12 - 1px), var(--line) calc((100% - 200px)/12 - 1px), var(--line) calc((100% - 200px)/12));
  background-position: 200px 0; background-size: calc(100% - 200px) 100%; background-repeat: no-repeat }
.g-row:last-child { border-bottom: 0 }
.g-row:hover { background-color: var(--code-bg) }
.g-lbl { grid-column: 1; padding: 4px 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.g-row i { grid-row: 1; grid-column: calc(var(--s) + 1) / calc(var(--e) + 1); height: 14px; border-radius: 3px; margin: 0 3px; background: var(--c) }
.g-row[data-l="1"] { --c: var(--l1) } .g-row[data-l="2"] { --c: var(--l2) } .g-row[data-l="3"] { --c: var(--l3) } .g-row[data-l="4"] { --c: var(--l4) } .g-row[data-l="0"] { --c: var(--l0) }
.g-ms b { grid-row: 1; grid-column: calc(var(--m) + 1); justify-self: end; margin-right: -9px; width: 18px; height: 18px; transform: rotate(45deg); background: var(--accent); font-size: 0; z-index: 1 }
.legend { font: 500 .75rem var(--f-mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center }
.lg { display: inline-block; width: 12px; height: 8px; border-radius: 2px; margin-right: -8px }
.lg.l1 { background: var(--l1) } .lg.l2 { background: var(--l2) } .lg.l3 { background: var(--l3) } .lg.l4 { background: var(--l4) } .lg.l0 { background: var(--l0) }

.search { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding: 10px 0; display: flex; gap: 12px; align-items: center; flex-wrap: wrap }
.search input { flex: 1 1 260px; min-width: 0; font: 1rem var(--f-body); padding: 10px 12px; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--sheet); color: var(--ink) }
.search span { font: 500 .75rem var(--f-mono); color: var(--muted) }

@media (max-width: 960px) {
  .app { grid-template-columns: minmax(0,1fr) }
  .rail { position: fixed; z-index: 40; inset: 0 auto 0 0; width: min(86vw, 340px); transform: translateX(-102%); transition: transform .25s; padding-top: calc(20px + env(safe-area-inset-top, 0px)) }
  .app.open .rail { transform: none; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35) }
  .topbar { display: flex; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; align-items: center; gap: 12px; background: var(--sheet); border-bottom: 1px solid var(--line);
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .topbar button { font: 600 .85rem var(--f-body); background: none; color: var(--ink); border: 1.5px solid var(--ink); border-radius: 4px; padding: 6px 10px; cursor: pointer }
  .topbar b { font: 700 1.05rem var(--f-display); text-transform: uppercase; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap }
  main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
  .search { top: calc(env(safe-area-inset-top, 0px) + 52px) }
}
@media (max-width: 560px) {
  .titleblock { grid-template-columns: minmax(0,1fr) }
  .tb-num { grid-row: auto; border-right: 0; border-bottom: 1px solid var(--line-strong); display: flex; align-items: baseline; gap: 10px; text-align: left }
  .tb-num b { font-size: 2rem }
  .hero-stats { grid-template-columns: repeat(2, minmax(0,1fr)) }
  .hero-stats div:nth-child(2) { border-right: 0 }
  .hero-stats div:nth-child(-n+2) { border-bottom: 1px solid var(--line) }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; scroll-behavior: auto !important } }
</style>

<div class="app" id="app">
  <aside class="rail" id="rail" aria-label="Spis treści kursu">
    <a class="brand" href="#start">Akademia Kontraktów FIDIC<small>Od zera do eksperta · rev. 2026</small></a>
    <div class="overall">
      <div class="overall-top"><span>Postęp kursu</span><span id="overall-pct">0%</span></div>
      <div class="bar"><span id="overall-bar"></span></div>
    </div>
    <nav id="nav"></nav>
  </aside>
  <div style="min-width:0">
    <div class="topbar"><button type="button" id="menu" aria-controls="rail" aria-expanded="false">Spis treści</button><b id="topbar-title">Akademia Kontraktów FIDIC</b></div>
    <main id="main">
{{SECTIONS}}
    </main>
  </div>
</div>

<script>
const NAV = {{NAV}};
const GROUP_COLOR = {"L1 Foundation":"var(--l1)","L2 Practitioner":"var(--l2)","L3 Advanced":"var(--l3)","L4 Expert":"var(--l4)"};
const KEY = "fidic-academy-done-v1", LAST = "fidic-academy-last-v1";
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d } catch (e) { return d } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)) } catch (e) {} }
};
let done = new Set(store.get(KEY, []));
const CHECKABLE = /^(Lekcja|Część|Praktyka|Pytania kontrolne|EGZAMIN|\d+\.)/;
const checkable = {}; // module id -> [h2 ids]

// Lesson buttons
NAV.forEach(m => {
  const sec = document.getElementById(m.id);
  checkable[m.id] = [];
  sec.querySelectorAll(".prose h2").forEach(h => {
    const t = h.textContent.trim();
    if (m.id === "start" || m.id === "slownik" || !CHECKABLE.test(t)) return;
    checkable[m.id].push(h.id);
    const b = document.createElement("button");
    b.type = "button"; b.className = "check"; b.dataset.id = h.id;
    b.textContent = "Ukończone";
    b.setAttribute("aria-pressed", done.has(h.id));
    b.addEventListener("click", () => {
      done.has(h.id) ? done.delete(h.id) : done.add(h.id);
      store.set(KEY, [...done]); b.setAttribute("aria-pressed", done.has(h.id)); refresh();
    });
    h.appendChild(b);
  });
});

// Copy buttons
document.querySelectorAll(".prose pre").forEach(pre => {
  const w = document.createElement("div"); w.className = "codewrap";
  pre.parentNode.insertBefore(w, pre); w.appendChild(pre);
  const b = document.createElement("button"); b.type = "button"; b.className = "copy"; b.textContent = "Kopiuj";
  b.addEventListener("click", () => {
    const txt = pre.innerText;
    const ok = () => { b.textContent = "Skopiowano"; setTimeout(() => b.textContent = "Kopiuj", 1500) };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(pre); const s = getSelection(); s.removeAllRanges(); s.addRange(r); b.textContent = "Zaznaczono – Ctrl+C" };
    try { navigator.clipboard.writeText(txt).then(ok, fallback) } catch (e) { fallback() }
  });
  w.appendChild(b);
});

// Glossary search
(() => {
  const sec = document.getElementById("slownik"), prose = sec.querySelector(".prose");
  const box = document.createElement("div"); box.className = "search";
  box.innerHTML = '<label for="gl-q" class="muted" style="font:500 .75rem var(--f-mono);text-transform:uppercase;letter-spacing:.08em">Szukaj</label><input id="gl-q" type="search" placeholder="np. Abnahme, retention, kara umowna" autocomplete="off"><span id="gl-n"></span>';
  prose.insertBefore(box, prose.firstChild);
  const rows = [...prose.querySelectorAll("tbody tr")];
  const q = box.querySelector("input"), n = box.querySelector("#gl-n");
  const run = () => {
    const v = q.value.trim().toLowerCase(); let c = 0;
    rows.forEach(r => { const hit = !v || r.textContent.toLowerCase().includes(v); r.hidden = !hit; if (hit) c++ });
    prose.querySelectorAll(".tbl").forEach(t => { const any = [...t.querySelectorAll("tbody tr")].some(r => !r.hidden); t.hidden = !any; const h = t.previousElementSibling; if (h && h.tagName === "H2") h.hidden = !any });
    n.textContent = c + " / " + rows.length + " haseł";
  };
  q.addEventListener("input", run); run();
})();

// Navigation rail
const navEl = document.getElementById("nav");
const groups = [...new Set(NAV.map(m => m.group))];
groups.forEach(g => {
  const div = document.createElement("div"); div.className = "navgroup";
  div.style.setProperty("--c", GROUP_COLOR[g] || "var(--l0)");
  div.innerHTML = `<h3>${g}</h3>`;
  NAV.filter(m => m.group === g).forEach(m => {
    const a = document.createElement("a"); a.className = "navlink"; a.href = "#" + m.id; a.dataset.mod = m.id;
    a.innerHTML = `<span class="n">${m.num}</span><span>${m.label}</span><span class="p" data-p="${m.id}"></span>`;
    div.appendChild(a);
    const ul = document.createElement("ul"); ul.className = "lessons"; ul.dataset.for = m.id; ul.hidden = true;
    m.lessons.forEach(l => {
      const li = document.createElement("li"), la = document.createElement("a");
      la.href = "#" + m.id; la.textContent = l.t; la.dataset.target = l.id;
      la.addEventListener("click", e => { e.preventDefault(); show(m.id, l.id); closeRail() });
      li.appendChild(la); ul.appendChild(li);
    });
    div.appendChild(ul);
  });
  navEl.appendChild(div);
});

function refresh() {
  let total = 0, d = 0;
  NAV.forEach(m => {
    const ids = checkable[m.id]; const c = ids.filter(i => done.has(i)).length;
    total += ids.length; d += c;
    const p = document.querySelector(`[data-p="${m.id}"]`);
    if (p) { p.textContent = ids.length ? Math.round(100 * c / ids.length) + "%" : ""; p.classList.toggle("full", ids.length && c === ids.length) }
  });
  document.querySelectorAll(".lessons a").forEach(a => a.classList.toggle("done", done.has(a.dataset.target)));
  const pct = total ? Math.round(100 * d / total) : 0;
  document.getElementById("overall-pct").textContent = pct + "%";
  document.getElementById("overall-bar").style.width = pct + "%";
  const dp = document.getElementById("done-pct"); if (dp) dp.textContent = pct + "%";
  const lc = document.getElementById("lesson-count"); if (lc) lc.textContent = total;
}

// Pagers
const order = NAV.map(m => m.id);
NAV.forEach((m, i) => {
  const p = document.querySelector(`#${m.id} .pager`);
  const prev = NAV[i - 1], next = NAV[i + 1];
  p.innerHTML = (prev ? `<a href="#${prev.id}"><small>← Poprzedni</small>${prev.num !== "—" ? prev.num + " " : ""}${prev.label}</a>` : "") +
                (next ? `<a class="next" href="#${next.id}"><small>Następny →</small>${next.num !== "—" ? next.num + " " : ""}${next.label}</a>` : "");
});

function show(id, anchor) {
  if (!order.includes(id)) id = "start";
  document.querySelectorAll(".module").forEach(s => s.hidden = s.id !== id);
  document.querySelectorAll(".navlink").forEach(a => a.dataset.mod === id ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"));
  document.querySelectorAll(".lessons").forEach(u => u.hidden = u.dataset.for !== id);
  const sec = document.getElementById(id);
  document.getElementById("topbar-title").textContent = sec.dataset.title;
  if (id !== "start") store.set(LAST, id);
  if (anchor) { const el = document.getElementById(anchor); if (el) { el.scrollIntoView({ block: "start" }); return } }
  window.scrollTo(0, 0);
}
function route() { show((location.hash || "#start").slice(1)); closeRail() }
window.addEventListener("hashchange", route);

// Resume button
(() => {
  const last = store.get(LAST, null), btn = document.getElementById("resume");
  if (last && btn && order.includes(last)) { const m = NAV.find(x => x.id === last); btn.href = "#" + last; btn.textContent = "Kontynuuj: " + (m.num !== "—" ? m.num + " " : "") + m.label }
})();

// Mobile rail
const app = document.getElementById("app"), menu = document.getElementById("menu");
function closeRail() { app.classList.remove("open"); menu.setAttribute("aria-expanded", "false") }
menu.addEventListener("click", () => { const o = app.classList.toggle("open"); menu.setAttribute("aria-expanded", o) });
document.addEventListener("click", e => { if (app.classList.contains("open") && !e.target.closest(".rail") && e.target !== menu) closeRail() });
document.addEventListener("keydown", e => { if (e.key === "Escape") closeRail() });

refresh(); route();
</script>
